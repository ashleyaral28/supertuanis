spring.application.name=supertuanis

#puerto por donde escucha nuestro servidor web (en Render llega en la variable PORT)
server.port=${PORT:8080}

#para definir el formato de salida del log en cuanto a horas y minutos s
logging.pattern.dateformat=hh:mm

#Evitamos la salida del banner de spring
spring.main.banner-mode=off

#Definimos el cache como false en desarrollo, en produccion sera true
spring.thymeleaf.cache=false

#conexion local a la DB supertuanis en MYSQL (en Render se cambia con las variables DB_URL, DB_USER y DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supertuanis?allowPublicKeyRetrieval=true}

#User y clave para ingresar a la DB
spring.datasource.username=${DB_USER:usuario_supertuanis}
spring.datasource.password=${DB_PASSWORD:Super_Tuanis.2026}

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar informacion en el log DB
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.type.descriptor.sql.BasicBinder=trace

#Tamaño maximo de las imagenes que se suben
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Esta informacion se utiliza para tener acceso a su storage
#El bucket es el id del proyecto de Firebase + .firebasestorage.app (se ve en Firebase > Storage)
firebase.bucket.name=${FIREBASE_BUCKET:techshop-a8349.firebasestorage.app}
firebase.storage.path=supertuanis
firebase.json.path=firebase
firebase.json.file=techshop-a8349-firebase-adminsdk-fbsvc-ecfd3b780d.json
#Solo en la nube: ruta absoluta del JSON cuando no va dentro del proyecto (ver README, Render)
firebase.json.external=${FIREBASE_JSON_PATH:}
