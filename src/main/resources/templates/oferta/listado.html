<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container st-principal">
            <section class="text-center st-presentacion">
                <h1 class="st-titulo">[[#{oferta.titulo}]]</h1>
                <p class="st-subtitulo">[[#{oferta.subtitulo}]]</p>
            </section>

            <section class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" th:if="${not #lists.isEmpty(ofertas)}">
                <th:block th:each="o : ${ofertas}">
                    <div class="col">
                        <article th:replace="~{catalogo/fragmentos :: oferta(${o})}"></article>
                    </div>
                </th:block>
            </section>
            <div class="alert alert-light text-center" th:if="${#lists.isEmpty(ofertas)}">[[#{oferta.vacio}]]</div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
