<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <!-- Fragmento #1 que irá en el head de todas las páginas, así se incluye todo lo necesario de configuración-->
    <head th:fragment="head">
        <title>[[#{aplicacion.titulo}]]</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </head>

    <body>
        <!-- Fragmento #2 define el encabezado de las páginas: nombre del supermercado y menú.
             Cada controlador manda el atributo "activa" (inicio, productos u ofertas) para resaltar la opción actual. -->
        <header th:fragment="header" class="st-header">
            <nav class="navbar navbar-expand-md st-navbar">
                <div class="container">
                    <a th:href="@{/}" class="navbar-brand st-marca">
                        <i class="fa-solid fa-cart-shopping"></i> [[#{aplicacion.titulo}]]
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                            aria-expanded="false" aria-label="Menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                        <ul class="navbar-nav align-items-md-center gap-md-2">
                            <li class="nav-item">
                                <a class="nav-link st-enlace" th:classappend="${activa == 'productos'} ? 'activo'"
                                   th:href="@{/catalogo/listado}">[[#{plantilla.productos}]]</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link st-enlace" th:classappend="${activa == 'ofertas'} ? 'activo'"
                                   th:href="@{/oferta/listado}">[[#{plantilla.ofertas}]]</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link st-enlace" th:classappend="${activa == 'inicio'} ? 'activo'"
                                   th:href="@{/}">[[#{plantilla.inicio}]]</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link st-enlace" th:classappend="${activa == 'carrito'} ? 'activo'"
                                   th:href="@{/carrito/listado}" th:title="#{plantilla.carrito}">
                                    <i class="fa-solid fa-cart-shopping"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Fragmento #3 define el footer de las páginas -->
        <footer th:fragment="footer" class="st-footer">
            <p class="text-center m-0">[[#{plantilla.derechos}]]</p>
        </footer>

        <!-- Fragmento #4 define la ventana modal para mostrar un Toast (mensajes de error o de todo bien) -->
        <section th:fragment="mostrarToast">
            <div aria-live="polite" aria-atomic="true"
                 class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
                <div th:if="${error}" class="toast show" role="alert" aria-live="assertive" aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-danger">
                        <i class="fa-solid fa-bomb"></i> <strong class="me-auto"> [[#{error}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${error}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
                <div th:if="${todoOk}" class="toast show" role="status" aria-live="polite" aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-success">
                        <i class="fa-solid fa-square-check"></i> <strong class="me-auto"> [[#{atencion}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${todoOk}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
