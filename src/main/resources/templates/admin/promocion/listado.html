<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container st-principal">

            <div class="d-flex flex-wrap justify-content-between
                 align-items-center gap-3 mb-4">

                <div>

                    <h1 th:text="#{admin.promociones.titulo}">
                        Gestión de promociones
                    </h1>

                    <p class="text-muted"
                       th:text="#{admin.promociones.subtitulo}">
                        Cree y administre las ofertas
                    </p>

                </div>

                <button type="button"
                        class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#modalPromocion">

                    <i class="fa-solid fa-plus"></i>

                    <span th:text="#{admin.promociones.nueva}">
                        Nueva promoción
                    </span>

                </button>

            </div>

            <p class="st-total">

                <span th:text="#{admin.promociones.total}">
                    Total de promociones
                </span>:

                <strong th:text="${totalPromociones}">
                    0
                </strong>

            </p>

            <div class="table-responsive"
                 th:if="${!#lists.isEmpty(promociones)}">

                <table class="table table-striped
                       table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th th:text="#{admin.promociones.producto}">
                                Producto
                            </th>

                            <th th:text="#{admin.promociones.porcentaje}">
                                Descuento
                            </th>

                            <th th:text="#{admin.promociones.fechaInicio}">
                                Fecha inicial
                            </th>

                            <th th:text="#{admin.promociones.fechaFin}">
                                Fecha final
                            </th>

                            <th>Precio normal</th>

                            <th>Precio con oferta</th>

                            <th th:text="#{admin.promociones.acciones}">
                                Acciones
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="pr : ${promociones}">

                            <td>

                                <strong th:text="${pr.producto != null
                                        ? pr.producto.descripcion
                                        : '-'}">
                                    Producto
                                </strong>

                            </td>

                            <td>

                                <span class="badge text-bg-danger fs-6">

                                    <span th:text="${pr.porcentaje}">
                                        0
                                    </span>%

                                </span>

                            </td>

                            <td th:text="${pr.fechaInicio}">
                                2026-01-01
                            </td>

                            <td th:text="${pr.fechaFin}">
                                2026-01-31
                            </td>

                            <td th:text="${pr.producto != null
                                ? #numbers.formatCurrency(
                                pr.producto.precio)
                                : '-'}">
                                ₡0
                            </td>

                            <td th:text="${#numbers.formatCurrency(
                                pr.precioOferta)}"
                                class="fw-bold text-success">
                                ₡0
                            </td>

                            <td class="text-nowrap">

                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/admin/promociones/modificar/{id}
                                   (id=${pr.idPromocion})}"
                                   th:title="#{accion.actualizar}">

                                    <i class="fa-solid fa-pen-to-square"></i>

                                </a>

                                <form th:action="@{/admin/promociones/eliminar}"
                                      method="post"
                                      class="d-inline">

                                    <input type="hidden"
                                           name="idPromocion"
                                           th:value="${pr.idPromocion}"/>

                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            th:title="#{accion.eliminar}"
                                            onclick="return confirm(
                                            '¿Desea eliminar esta promoción?'
                                            );">

                                        <i class="fa-solid fa-trash"></i>

                                    </button>

                                </form>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="alert alert-info text-center"
                 th:if="${#lists.isEmpty(promociones)}"
                 th:text="#{admin.promociones.vacio}">

                No hay promociones registradas

            </div>

        </main>


        <!-- Ventana modal para agregar promociones -->
        <div class="modal fade"
             id="modalPromocion"
             tabindex="-1"
             aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">

                    <form th:action="@{/admin/promociones/guardar}"
                          th:object="${promocion}"
                          method="post">

                        <div class="modal-header">

                            <h5 class="modal-title"
                                th:text="#{admin.promociones.nueva}">
                                Nueva promoción
                            </h5>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>

                        </div>

                        <div class="modal-body">

                            <div class="mb-3">

                                <label for="producto"
                                       class="form-label"
                                       th:text="#{admin.promociones.producto}">
                                    Producto
                                </label>

                                <select id="producto"
                                        name="producto.idProducto"
                                        class="form-select"
                                        required="required">

                                    <option value="">
                                        Seleccione un producto
                                    </option>

                                    <option th:each="p : ${productos}"
                                            th:value="${p.idProducto}"
                                            th:text="${p.descripcion}">
                                        Producto
                                    </option>

                                </select>

                            </div>

                            <div class="mb-3">

                                <label for="porcentaje"
                                       class="form-label"
                                       th:text="#{admin.promociones.porcentaje}">
                                    Descuento
                                </label>

                                <div class="input-group">

                                    <input type="number"
                                           id="porcentaje"
                                           class="form-control"
                                           th:field="*{porcentaje}"
                                           min="1"
                                           max="100"
                                           required="required"/>

                                    <span class="input-group-text">
                                        %
                                    </span>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label for="fechaInicio"
                                       class="form-label"
                                       th:text="#{admin.promociones.fechaInicio}">
                                    Fecha inicial
                                </label>

                                <input type="date"
                                       id="fechaInicio"
                                       class="form-control"
                                       th:field="*{fechaInicio}"
                                       required="required"/>

                            </div>

                            <div class="mb-3">

                                <label for="fechaFin"
                                       class="form-label"
                                       th:text="#{admin.promociones.fechaFin}">
                                    Fecha final
                                </label>

                                <input type="date"
                                       id="fechaFin"
                                       class="form-control"
                                       th:field="*{fechaFin}"
                                       required="required"/>

                            </div>

                        </div>

                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal"
                                    th:text="#{accion.cerrar}">
                                Cerrar
                            </button>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="fa-solid fa-floppy-disk"></i>

                                <span th:text="#{accion.guardar}">
                                    Guardar
                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}">
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
