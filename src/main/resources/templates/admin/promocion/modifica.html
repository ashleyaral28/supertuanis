<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container st-principal">

            <div class="card shadow-sm">

                <div class="card-header bg-warning">

                    <h1 class="h4 m-0"
                        th:text="#{admin.promociones.modificar}">
                        Modificar promoción
                    </h1>

                </div>

                <div class="card-body">

                    <form th:action="@{/admin/promociones/guardar}"
                          th:object="${promocion}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idPromocion}"/>

                        <div class="mb-3">

                            <label for="producto"
                                   class="form-label"
                                   th:text="#{admin.promociones.producto}">
                                Producto
                            </label>

                            <select id="producto"
                                    class="form-select"
                                    th:field="*{producto.idProducto}"
                                    required="required">

                                <option value="">
                                    Seleccione un producto
                                </option>

                                <option th:each="p : ${productos}"
                                        th:value="${p.idProducto}"
                                        th:text="${p.descripcion}">
                                    Producto
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="porcentaje"
                                   class="form-label"
                                   th:text="#{admin.promociones.porcentaje}">
                                Descuento
                            </label>

                            <div class="input-group">

                                <input type="number"
                                       id="porcentaje"
                                       class="form-control"
                                       th:field="*{porcentaje}"
                                       min="1"
                                       max="100"
                                       required="required"/>

                                <span class="input-group-text">
                                    %
                                </span>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('porcentaje')}"
                                 th:errors="*{porcentaje}">
                                Error
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="fechaInicio"
                                   class="form-label"
                                   th:text="#{admin.promociones.fechaInicio}">
                                Fecha inicial
                            </label>

                            <input type="date"
                                   id="fechaInicio"
                                   name="fechaInicio"
                                   class="form-control"
                                   th:value="${promocion.fechaInicio != null
                                   ? promocion.fechaInicio.toString()
                                   : ''}"
                                   required="required"/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('fechaInicio')}"
                                 th:errors="*{fechaInicio}">
                                Error
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="fechaFin"
                                   class="form-label"
                                   th:text="#{admin.promociones.fechaFin}">
                                Fecha final
                            </label>

                            <input type="date"
                                   id="fechaFin"
                                   name="fechaFin"
                                   class="form-control"
                                   th:value="${promocion.fechaFin != null
                                   ? promocion.fechaFin.toString()
                                   : ''}"
                                   required="required"/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('fechaFin')}"
                                 th:errors="*{fechaFin}">
                                Error
                            </div>

                        </div>

                        <div class="d-flex justify-content-end
                             gap-2 mt-4">

                            <a th:href="@{/admin/promociones/listado}"
                               class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left"></i>

                                <span th:text="#{accion.regresar}">
                                    Regresar
                                </span>

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="fa-solid fa-floppy-disk"></i>

                                <span th:text="#{accion.guardar}">
                                    Guardar
                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

        <section th:replace="~{general/fragmentos :: mostrarToast}">
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
