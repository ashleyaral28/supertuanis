<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container st-principal">

            <div class="d-flex flex-wrap justify-content-between
                 align-items-center gap-3 mb-4">

                <div>
                    <h1 th:text="#{admin.productos.titulo}">
                        Administración de productos
                    </h1>

                    <p class="text-muted"
                       th:text="#{admin.productos.subtitulo}">
                        Agregue, modifique o elimine productos
                    </p>
                </div>

                <button type="button"
                        class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#modalProducto">

                    <i class="fa-solid fa-plus"></i>

                    <span th:text="#{admin.productos.nuevo}">
                        Nuevo producto
                    </span>

                </button>

            </div>

            <p class="st-total">

                <span th:text="#{admin.productos.total}">
                    Total de productos
                </span>:

                <strong th:text="${totalProductos}">0</strong>

            </p>

            <div class="table-responsive"
                 th:if="${!#lists.isEmpty(productos)}">

                <table class="table table-striped table-hover
                       align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Imagen</th>

                            <th th:text="#{admin.productos.nombre}">
                                Nombre
                            </th>

                            <th th:text="#{admin.productos.marca}">
                                Marca
                            </th>

                            <th th:text="#{admin.productos.categoria}">
                                Categoría
                            </th>

                            <th th:text="#{admin.productos.precio}">
                                Precio
                            </th>

                            <th th:text="#{admin.productos.existencias}">
                                Existencias
                            </th>

                            <th th:text="#{admin.productos.activo}">
                                Activo
                            </th>

                            <th th:text="#{admin.productos.acciones}">
                                Acciones
                            </th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="p : ${productos}">

                            <td>
                                <img th:if="${p.rutaImagen != null
                                     and !p.rutaImagen.isBlank()}"
                                     th:src="${p.rutaImagen}"
                                     th:alt="${p.descripcion}"
                                     style="width: 65px;
                                     height: 65px;
                                     object-fit: contain;"/>

                                <span th:if="${p.rutaImagen == null
                                      or p.rutaImagen.isBlank()}"
                                      class="text-muted">
                                    Sin imagen
                                </span>
                            </td>

                            <td th:text="${p.descripcion}">
                                Producto
                            </td>

                            <td th:text="${p.marca}">
                                Marca
                            </td>

                            <td th:text="${p.categoria != null
                                ? p.categoria.descripcion
                                : '-'}">
                                Categoría
                            </td>

                            <td th:text="${#numbers.formatCurrency(p.precio)}">
                                ₡0
                            </td>

                            <td>
                                <span th:text="${p.existencias}"
                                      th:classappend="${p.existencias == 0}
                                      ? 'badge text-bg-danger'
                                      : (${p.existencias <= 5}
                                      ? 'badge text-bg-warning'
                                      : 'badge text-bg-success')">
                                    0
                                </span>
                            </td>

                            <td>
                                <span th:if="${p.activo}"
                                      class="badge text-bg-success">
                                    Sí
                                </span>

                                <span th:unless="${p.activo}"
                                      class="badge text-bg-secondary">
                                    No
                                </span>
                            </td>

                            <td class="text-nowrap">

                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/admin/productos/modificar/{id}
                                   (id=${p.idProducto})}"
                                   th:title="#{accion.actualizar}">

                                    <i class="fa-solid fa-pen-to-square"></i>

                                </a>

                                <form th:action="@{/admin/productos/eliminar}"
                                      method="post"
                                      class="d-inline">

                                    <input type="hidden"
                                           name="idProducto"
                                           th:value="${p.idProducto}"/>

                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            th:title="#{accion.eliminar}"
                                            onclick="return confirm(
                                            '¿Desea eliminar este producto?'
                                            );">

                                        <i class="fa-solid fa-trash"></i>

                                    </button>

                                </form>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="alert alert-info text-center"
                 th:if="${#lists.isEmpty(productos)}"
                 th:text="#{admin.productos.vacio}">

                No hay productos registrados

            </div>

        </main>


        <!-- Ventana modal para agregar productos -->
        <div class="modal fade"
             id="modalProducto"
             tabindex="-1"
             aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <form th:action="@{/admin/productos/guardar}"
                          th:object="${producto}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="modal-header">

                            <h5 class="modal-title"
                                th:text="#{admin.productos.nuevo}">
                                Nuevo producto
                            </h5>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>

                        </div>

                        <div class="modal-body">

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label"
                                           for="descripcion"
                                           th:text="#{admin.productos.nombre}">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           id="descripcion"
                                           class="form-control"
                                           th:field="*{descripcion}"
                                           maxlength="50"
                                           required="required"/>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label"
                                           for="marca"
                                           th:text="#{admin.productos.marca}">
                                        Marca
                                    </label>

                                    <input type="text"
                                           id="marca"
                                           class="form-control"
                                           th:field="*{marca}"
                                           maxlength="50"/>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label"
                                           for="categoria"
                                           th:text="#{admin.productos.categoria}">
                                        Categoría
                                    </label>

                                    <select id="categoria"
                                            name="categoria.idCategoria"
                                            class="form-select"
                                            required="required">

                                        <option value="">
                                            Seleccione una categoría
                                        </option>

                                        <option th:each="c : ${categorias}"
                                                th:value="${c.idCategoria}"
                                                th:text="${c.descripcion}">
                                            Categoría
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-3">

                                    <label class="form-label"
                                           for="precio"
                                           th:text="#{admin.productos.precio}">
                                        Precio
                                    </label>

                                    <input type="number"
                                           id="precio"
                                           class="form-control"
                                           th:field="*{precio}"
                                           min="0.01"
                                           step="0.01"
                                           required="required"/>

                                </div>

                                <div class="col-md-3">

                                    <label class="form-label"
                                           for="existencias"
                                           th:text="#{admin.productos.existencias}">
                                        Existencias
                                    </label>

                                    <input type="number"
                                           id="existencias"
                                           class="form-control"
                                           th:field="*{existencias}"
                                           min="0"
                                           required="required"/>

                                </div>

                                <div class="col-12">

                                    <label class="form-label"
                                           for="detalle"
                                           th:text="#{admin.productos.detalle}">
                                        Descripción
                                    </label>

                                    <textarea id="detalle"
                                              class="form-control"
                                              th:field="*{detalle}"
                                              rows="3">
                                    </textarea>

                                </div>

                                <div class="col-md-8">

                                    <label class="form-label"
                                           for="imagenFile"
                                           th:text="#{admin.productos.imagen}">
                                        Imagen
                                    </label>

                                    <input type="file"
                                           id="imagenFile"
                                           name="imagenFile"
                                           class="form-control"
                                           accept="image/*"/>

                                </div>

                                <div class="col-md-4
                                     d-flex align-items-end">

                                    <div class="form-check mb-2">

                                        <input type="checkbox"
                                               id="activo"
                                               class="form-check-input"
                                               th:field="*{activo}"/>

                                        <label for="activo"
                                               class="form-check-label"
                                               th:text="#{admin.productos.activo}">
                                            Activo
                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal"
                                    th:text="#{accion.cerrar}">
                                Cerrar
                            </button>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="fa-solid fa-floppy-disk"></i>

                                <span th:text="#{accion.guardar}">
                                    Guardar
                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}">
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
